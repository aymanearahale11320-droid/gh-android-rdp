name: final-android-desktop

# ═══════════════════════════════════════════════════════════════════════════
#  Ubuntu 24.04 + KVM + Android emulator + سطح مكتب xfce + Chrome
#
#  بعد التشغيل:
#    RDP  ->  <IP>:3389   user: runner   pass: في Summary
#    داخل السطح المكتب: نافذة Android تفتح تلقائيًا (scrcpy) + Chrome للتحميل
#    من جهازك مباشرة (بدون RDP): adb connect <IP>:5555 && scrcpy
#
#  الحد الصلب: 6 ساعات لكل job على GitHub-hosted (لا يمكن تجاوزه).
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      instances:
        description: "Emulator instances (1-3)"
        default: "1"
      api_level:
        description: "Android API level"
        default: "33"
      image_type:
        description: "google_apis (root) | google_apis_playstore (Play Store)"
        default: "google_apis"

concurrency:
  group: android-session
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # ── 1. KVM: التسريع الحقيقي ──────────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # ── 2. تحرير القرص (14 GB -> ~30 GB) ─────────────────────────────────
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      # ── 3. سطح المكتب + Chrome + أدوات ───────────────────────────────────
      - name: Install desktop stack
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq \
            xfce4 xfce4-terminal thunar dbus-x11 xrdp ssl-cert \
            socat unzip wget curl scrcpy >/dev/null

          # Chrome الرسمي (وليس snap) — يعمل على 24.04 بلا مشاكل
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            && sudo apt-get install -y -qq /tmp/chrome.deb >/dev/null \
            || echo "Chrome install failed, falling back to xfce browser"

          sudo adduser xrdp ssl-cert >/dev/null 2>&1 || true
          echo "desktop stack done"

      # ── 4. Tailscale ─────────────────────────────────────────────────────
      - name: Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/publish.sh
          curl -fsSL https://tailscale.com/install.sh | sh
          HOST="gh-android-$GITHUB_RUN_ID"
          URL=""

          if [ -n "$TS_AUTHKEY" ]; then
            sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="$HOST" --accept-dns=false || true
          else
            sudo bash -c "nohup tailscale up --hostname=$HOST --accept-dns=false >/tmp/ts.log 2>&1 &"
            for i in $(seq 1 40); do
              grep -q 'login.tailscale.com' /tmp/ts.log 2>/dev/null && break
              sleep 3
            done
            URL=$(grep -oE 'https://login\.tailscale\.com/[^[:space:]]+' /tmp/ts.log | head -1 || true)
            echo "LOGIN_URL=$URL" >> $GITHUB_ENV
            echo "::notice title=Tailscale login::افتح الرابط: $URL"
            { echo "## تفعيل السيرفر"; echo; echo "$URL"; } >> $GITHUB_STEP_SUMMARY
            publish "LOGIN_URL=$URL"
          fi

          IP=""
          for i in $(seq 1 360); do
            IP=$(tailscale ip -4 2>/dev/null || true); [ -n "$IP" ] && break
            sleep 5
          done
          if [ -n "$IP" ]; then
            echo "TS_IP=$IP" >> $GITHUB_ENV
            publish "IP=$IP"
            echo "Tailscale IP: $IP"
          else
            echo "::warning::not authorized yet - continuing, the watchdog keeps polling"
            publish "LOGIN_URL=$URL"
          fi

      # ── 5. الفتح للـtailnet فقط، وإغلاق كل شيء آخر ───────────────────────
      - name: Firewall (tailnet only)
        run: |
          for p in 3389 15555 15557 15559; do
            sudo iptables -A INPUT -i tailscale0 -p tcp --dport $p -j ACCEPT
          done
          sudo iptables -A INPUT -p tcp --dport 3389 -j DROP
          echo "firewall rules:"
          sudo iptables -S INPUT | tail -12

      # ── 6. SDK + AVD ─────────────────────────────────────────────────────
      - name: Create AVDs
        run: |
          export SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          IMG="system-images;android-${{ inputs.api_level }};${{ inputs.image_type }};x86_64"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "$IMG" | tail -2

          N=${{ inputs.instances }}
          for i in $(seq 0 $((N-1))); do
            NAME="emu$i"
            echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd \
                       -n "$NAME" -k "$IMG" -d pixel_5 --force \
                       -p "$ANDROID_AVD_HOME/$NAME.avd" >/dev/null
            INI="$ANDROID_AVD_HOME/$NAME.avd/config.ini"
            [ -f "$INI" ] || { echo "AVD creation failed for $NAME"; exit 1; }
            sed -i -E '/^(hw\.ramSize|hw\.cpu\.ncore|vm\.heapSize|disk\.dataPartition|hw\.gpu\.)/d' "$INI"
            printf '%s\n' \
              'hw.ramSize=2048' 'vm.heapSize=256' 'hw.cpu.ncore=2' \
              'hw.gpu.enabled=yes' 'hw.gpu.mode=swiftshader_indirect' \
              'disk.dataPartition.size=3G' >> "$INI"
          done
          echo "AVDs created: $N"

      # ── 7. تشغيل المحاكيات (بلا نافذة — تعرض عبر scrcpy) ──────────────────
      - name: Launch emulators
        run: |
          export SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          N=${{ inputs.instances }}
          for i in $(seq 0 $((N-1))); do
            CONSOLE=$((5554 + i*2))
            nohup "$SDK/emulator/emulator" -avd "emu$i" \
              -no-window -no-audio -no-boot-anim -no-snapshot \
              -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 \
              -port $CONSOLE -camera-back none -camera-front none \
              > "/tmp/emu$i.log" 2>&1 &
            echo "emu$i -> console $CONSOLE"
          done

      - name: Wait for boot
        run: |
          export SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/platform-tools/adb" start-server
          START=$(date +%s)
          for i in $(seq 1 90); do
            if [ "$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "booted in $(( $(date +%s) - START ))s"; break
            fi
            sleep 5
          done
          "$SDK/platform-tools/adb" devices -l
          tail -5 /tmp/emu0.log || true

      # ── 8. ADB عبر tailnet (لـscrcpy من جهازك) ───────────────────────────
      - name: Expose adb
        run: |
          N=${{ inputs.instances }}
          for i in $(seq 0 $((N-1))); do
            EXT=$((15555 + i*2)); INT=$((5555 + i*2))
            nohup socat TCP-LISTEN:$EXT,fork,reuseaddr TCP:127.0.0.1:$INT > "/tmp/socat$i.log" 2>&1 &
          done
          sleep 2; ss -ltn | grep -E ':(1555[0-9])' || true

      # ── 9. RDP: مستخدم + جلسة xfce بلا قفل شاشة ─────────────────────────
      - name: Configure RDP session
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          PW="$RDP_PASS"
          if [ -z "$PW" ]; then PW="Rd$(openssl rand -hex 8)"; fi
          echo "runner:$PW" | sudo chpasswd
          echo "RDP_PASS_PLAIN=$PW" >> $GITHUB_ENV

          printf '%s\n' \
            '#!/bin/sh' \
            'export XDG_SESSION_TYPE=x11' \
            'export XDG_CURRENT_DESKTOP=XFCE' \
            'xset s off; xset -dpms; xset s noblank' \
            'exec dbus-launch --sh-syntax --exit-with-session startxfce4' > ~/.xsession
          chmod +x ~/.xsession

          # adb + scrcpy في PATH لكل الجلسات
          export SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "export PATH=\$PATH:$SDK/platform-tools" | sudo tee /etc/profile.d/android.sh >/dev/null

          # نافذة Android تفتح تلقائيًا داخل السطح المكتب
          mkdir -p ~/.config/autostart
          printf '%s\n' \
            '[Desktop Entry]' 'Type=Application' 'Name=Android' \
            'Exec=bash -lc "sleep 8; scrcpy --max-size 1280 --max-fps 30 --window-title Android"' \
            'Terminal=false' 'X-GNOME-Autostart-enabled=true' > ~/.config/autostart/android.desktop

          # لا سبات ولا قفل شاشة
          xfconf-query -c xfce4-power-manager -p /xfce4-power-manager/dpms-enabled -n -t bool -s false 2>/dev/null || true

          sudo sed -i -E 's/^#?port=3389/port=3389/' /etc/xrdp/xrdp.ini
          sudo systemctl enable xrdp >/dev/null 2>&1
          sudo systemctl restart xrdp
          sudo systemctl is-active xrdp

      # ── 10. الملخص ───────────────────────────────────────────────────────
      - name: Summary
        run: |
          N=${{ inputs.instances }}
          {
            echo "## الوصول"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| RDP | \`$TS_IP:3389\` |"
            echo "| User | \`runner\` |"
            echo "| Password | \`$RDP_PASS_PLAIN\` |"
            echo "| ADB (من جهازك) | \`adb connect $TS_IP:15555\` ثم \`scrcpy\` |"
            echo "| Instances | $N (منافذ 15555 / 15557 / 15559) |"
            if [ -n "$LOGIN_URL" ]; then echo "| Tailscale | [$LOGIN_URL]($LOGIN_URL) |"; fi
            echo ""
            echo "داخل السطح المكتب: Chrome + نافذة Android (scrcpy) تلقائيًا."
            echo ""
            echo "> تُحذف الآلة عند سقف 6 ساعات."
          } | tee -a $GITHUB_STEP_SUMMARY

      # ── 11. Watchdog: يحيي المحاكي و xrdp إن سقطا ────────────────────────
      - name: Keep alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/publish.sh
          export SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          N=${{ inputs.instances }}

          # لو لم يُفعَّل Tailscale بعد: ننتظر الضغطة وننشر الـIP فور توفره
          if [ -z "$TS_IP" ]; then
            for i in $(seq 1 720); do
              IP=$(tailscale ip -4 2>/dev/null || true)
              if [ -n "$IP" ]; then
                echo "TS_IP=$IP" >> $GITHUB_ENV
                publish "IP=$IP"
                echo "tailscale authorised: $IP"
                break
              fi
              sleep 5
            done
          fi
          END=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            for i in $(seq 0 $((N-1))); do
              if ! pgrep -f "\-avd emu$i" >/dev/null; then
                echo "[$(date +%H:%M:%S)] emu$i dead -> restart"
                nohup "$SDK/emulator/emulator" -avd "emu$i" -no-window -no-audio \
                  -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on \
                  -memory 2048 -cores 2 -port $((5554 + i*2)) >> "/tmp/emu$i.log" 2>&1 &
                sleep 20
              fi
            done
            sudo systemctl is-active --quiet xrdp || sudo systemctl restart xrdp
            echo "[$(date +%H:%M:%S)] qemu=$(pgrep -fc qemu-system-x86_64 || echo 0) xrdp=$(systemctl is-active xrdp)"
            sleep 120
          done
